[project]
name = "roborock-auto"
version = "0.1.0"
description = "Local control app + carpet-aware two-stage clean for a Roborock Qrevo L Pro"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-roborock>=2.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborock_auto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Body(...) default is the framework's idiom.
# C408: dict(...) builder in test config helpers reads fine.
ignore = ["B008", "C408"]
