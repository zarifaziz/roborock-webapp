[project]
name = "roborock-webapp"
version = "0.1.0"
description = "Self-hosted web app for Roborock robot vacuums: multi-step cleaning sequences, a carpet-aware vacuum-then-mop clean, and a Claude cleaning assistant"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-roborock>=2.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "claude-agent-sdk>=0.2.159,<0.3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborock_auto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Body(...) default is the framework's idiom.
# C408: dict(...) builder in test config helpers reads fine.
ignore = ["B008", "C408"]
